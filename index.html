<!DOCTYPE html>
<html lang="en">

<head>
    <title>Soul Food Cafe Menu</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Soul Food Cafe Menu" />
    <meta name="keywords" content="cafe, menu, food, drinks" />

</head>
<header class="fixed-header">
    <div class="logo">
        <span> <img class="logo-img" src="./images/logo_small.png" alt="Company Logo"> </span>
        <span><a href="#cafe-id">Café</a> </span>
        <span><a href="#te-id">Té</a> </span>
        <span><a href="#bebidas-id">Bebidas</a> </span>
        <span><a href="#tostas-id">Tostas</a> </span>
        <span><a href="#cuencos-id">Cuencos</a> </span>
        <span><a href="#smoothie-id">Smoothie</a> </span>
        <span><a href="#arepas-id">Arepas</a> </span>
        <div class="language-selector">
            <button id="lang-es" class="language-btn active">ES</button>
            <button id="lang-en" class="language-btn">EN</button>
        </div>
    </div>
</header>

<body>
    <div id="root"></div>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
