version: '3.8'
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - VITE_SFC_MENU_ADMIN_PWD=${VITE_SFC_MENU_ADMIN_PWD:-admin123}
    networks:
      - appnet

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    expose:
      - "3001"
    environment:
      - VITE_SFC_MENU_ADMIN_PWD=${VITE_SFC_MENU_ADMIN_PWD:-admin123}
    networks:
      - appnet

networks:
  appnet: